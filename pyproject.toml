[project]
name = "interview-agent"
version = "0.1.0"
description = "面试题库管理CLI工具"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "aiofiles>=24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=8.0.1",
    "loguru>=0.7.3",
    "openai>=2.50.0",
    "numpy>=2.5.1",
    "faiss-cpu>=1.14.3",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
]
