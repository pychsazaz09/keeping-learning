services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: interview_agent
      POSTGRES_PASSWORD: interview123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:interview123@db:5432/interview_agent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: "prod-secret-key"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pg_data: